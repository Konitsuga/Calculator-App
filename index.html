<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center p-2">
        <div class="row">
            <div class="col"></div>
            <div class="col-6 border">
                <h3 id="my_title">Calculator</h3>
            </div>
            <div class="col"></div>
        </div>
        <div class="row">
            <div class="col"></div>
            <div id="input_outr" class="col-6 border">
                <input class="form-control" type="text" id="input_ex" placeholder="Expression here...">
            </div>
            <div class="col"></div>
        </div>
    <!-- =========================================================================== -->
        <div class="row">
                <div class="col my_btn"></div>
                <div class="col-6 border">
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(1)">1</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(2)">2</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(3)">3</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in('+')">+</button>
                </div>
                <div class="col"></div>
        </div>
        <div class="row">
                <div class="col"></div>
                <div class="col-6 border">
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(4)">4</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(5)">5</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(6)">6</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in('-')">-</button>
                </div>
                <div class="col"></div>
        </div>
        <div class="row">
                <div class="col"></div>
                <div class="col-6 border">
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(7)">7</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(8)">8</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(9)">9</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in('*')">*</button>
                </div>
                <div class="col"></div>
        </div>
        <div class="row">
                <div class="col"></div>
                <div class="col-6 border">
                    <button type="button" class="btn btn-info my_btn" onclick="take_in('.')">.</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in(0)">0</button>
                    <button type="button" class="btn btn-info my_btn" onclick="clr('C')">C</button>
                    <button type="button" class="btn btn-info my_btn" onclick="take_in('/')">/</button>
                </div>
                <div class="col"></div>
        </div>
        <div class="row">
            <div class="col"></div>
            <div class="col-6 border">
                <button type="button" class="btn btn-info" onclick="calc()">Calculate</button>
            </div>
            <div class="col"></div>
        </div>
    </div>
    <!-- =========================================================================== -->
    <script src="script.js"></script>
    <script src=" https://cdn.jsdelivr.net/npm/mathjs@15.2.0/lib/browser/math.min.js "></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</body>
</html>
